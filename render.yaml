services:
  - type: web
    name: fd-reconciliation
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FD_DATABASE
        value: /var/data/fd_reconciliation.sqlite3
    disk:
      name: fd-reconciliation-data
      mountPath: /var/data
      sizeGB: 1
